<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groove Tycoon</title>
<meta name="description" content="Run a record shop on an Amsterdam canal for humans, cyborgs and robots, 2070 to 2089.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="in"><h1>Groove Tycoon</h1><p>Run a record shop on an Amsterdam canal for humans, cyborgs and robots, 2070 to 2089.</p></div></header>
<main class="wrap">
<section class="cab">
 <div class="hud">
  <div class="stat"><span>Date</span><b id="hDate">Jan 2070</b></div>
  <div class="stat"><span>Cash</span><b id="hCash">$0</b></div>
  <div class="stat"><span>Rep</span><b id="hRep">0</b></div>
  <div class="stat"><span>Vibe</span><b id="hVibe">0</b></div>
  <div class="stat"><span>Rank</span><b id="hRank">-</b></div>
  <div class="spd" id="spd"><button data-a="speed:0">Pause</button><button data-a="speed:1">1x</button><button data-a="speed:2">2x</button><button data-a="speed:4">4x</button><button data-a="walkm" id="walkB">Walk</button><button data-a="smoke" id="smkB" hidden>Smoke</button><button data-a="arr" id="arrB">Arrange</button></div>
 </div>
 <div class="prog"><i id="hProg"></i></div>
 <div class="screen"><canvas id="scr" width="768" height="432" aria-label="Your record shop"></canvas><div id="toast"></div><div id="cut" class="cut" hidden><div class="cbox"><b id="cutWho"></b><p id="cutTxt"></p><span class="cnext">Tap to continue ▸</span></div><button data-a="cutskip" class="cskip ghost">Skip intro</button></div></div>
 <div class="tip" id="tip" hidden><span id="tipT"></span><button data-a="skiptip" class="ghost">Hide tips</button></div>
</section>
<section class="panel">
 <nav class="tabs" id="tabs"><button data-a="tab:stock">Stock</button><button data-a="tab:shop">Shop</button><button data-a="tab:staff">Staff</button><button data-a="tab:pets">Pets</button><button data-a="tab:party">Party</button><button data-a="tab:chain">Chain</button><button data-a="tab:goals">Goals</button><button data-a="tab:research">Research</button><button data-a="tab:charts">Charts</button></nav>
 <div id="tabc"></div>
 <div class="foot"><button data-a="sound" id="sndB">Sound: off</button><button data-a="music" id="musB">Music: off</button><button data-a="save">Save</button><button data-a="export">Export save</button><button data-a="import">Import save</button><input type="file" id="impF" accept=".json,application/json" hidden><button data-a="newq" class="ghost">New game</button></div>
</section>
</main>
<div id="ov" class="ov" hidden><div class="box" id="box" role="dialog" aria-modal="true"></div></div>
<script src="dialogue.js"></script>
<script src="game.js"></script>
</body></html>
